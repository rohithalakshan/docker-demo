services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - my-network

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ronin
    ports:
      - 5432:5432
    networks:
      - my-network
    volumes:
      - postgres-s-data:/var/lib/postgresql

networks:
  my-network:
    driver: bridge

volumes:
  postgres-s-data: